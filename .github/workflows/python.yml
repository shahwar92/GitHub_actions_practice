name: install python

on:
  workflow_dispatch:

jobs:
  install-python:
    runs-on: ubuntu-latest
    steps:
      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: check python version
        run: python --version
      - name: check space
        run: df -h
          
        
